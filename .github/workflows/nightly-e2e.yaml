name: Nightly regression e2e test

on:
    schedule:
        # mon-fri at 5:30 AM
        - cron: '30 5 * * 1-5'
    workflow_dispatch:

env:
    PUSH_ANALYTICS_IMAGE: 'dhis2/push-analytics:local'
    LOG_LEVEL: 'scraper'

jobs:
    nightly-e2e:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - dhis2-image: 'dhis2/core-dev:2.41'
                      dhis2-major-version: '41'
                    - dhis2-image: 'dhis2/core-dev:2.42'
                      dhis2-major-version: '42'
                    - dhis2-image: 'dhis2/core-dev:2.43'
                      dhis2-major-version: '43'
                    - dhis2-image: 'dhis2/core-dev:master'
                      dhis2-major-version: '44'
        env:
            DHIS2_IMAGE: ${{ matrix.dhis2-image }}
            DHIS2_CORE_MAJOR_VERSION: ${{ matrix.dhis2-major-version }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7
            - name: Setup Docker BuildX
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
            - name: Build local Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  tags: dhis2/push-analytics:local
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Spin up the E2E environment
              # Fake SMTP is not needed for the e2e tests
              run: docker compose --env-file .env.e2e up -d web db db-dump post-install-scripts push-analytics
            - name: Run the e2e test suite
              run: docker compose --env-file .env.e2e up --abort-on-container-exit --exit-code-from e2e e2e
            - name: Copy scrape markdown logs and generated HTML to runner
              if: ${{ failure() }}
              run: |
                  mkdir e2e-output
                  mkdir e2e-output/scrape-markdown-logs
                  mkdir e2e-output/generated-html
                  pa_container_id="$(docker compose --env-file .env.e2e ps -q push-analytics)"
                  docker cp ${pa_container_id}:/usr/src/app/scrape-markdown-logs ./e2e-output
                  if [[ -d ./e2e/generated-html ]]; then cp -r ./e2e/generated-html ./e2e-output; fi
            - name: Store scrape markdown logs and generated HTML as a GHA artefact
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-output-${{ matrix.dhis2-major-version }}
                  path: e2e-output/

    send-slack-message:
        runs-on: ubuntu-latest
        if: |
            failure() &&
            !cancelled()
        needs: [nightly-e2e]
        steps:
            - uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_BACKEND_WEBHOOK }}
                  SLACK_CHANNEL: 'analytics-internal-bot'
                  SLACK_MESSAGE: 'Push Analytics Nightly E2E run failed and needs investigation ::female-detective:.'
                  SLACK_COLOR: '#ff0000'
