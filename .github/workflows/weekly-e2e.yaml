name: Weekly regression e2e test against stable DHIS2

on:
    schedule:
        # every Monday at 4:00 AM (UTC)
        - cron: '0 4 * * 1'
    workflow_dispatch:

env:
    PUSH_ANALYTICS_IMAGE: 'dhis2/push-analytics:local'
    LOG_LEVEL: 'scraper'

jobs:
    supported-versions:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Get the supported stable DHIS2 versions
              id: supported
              run: |
                  versions="$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://releases.dhis2.org/v1/versions/stable.json \
                      | jq -c '[.versions[] | select(.supported) | {image: "dhis2/core:\(.name)", major: "\(.version)"}]')"
                  echo "versions=${versions}" >> "${GITHUB_OUTPUT}"
            - name: Keep the versions that have a published Docker image
              id: matrix
              env:
                  VERSIONS: ${{ steps.supported.outputs.versions }}
              run: |
                  matrix="$(jq -c '.[]' <<< "${VERSIONS}" | while read -r version; do
                      if docker manifest inspect "$(jq -r .image <<< "${version}")" > /dev/null 2>&1; then
                          echo "${version}"
                      fi
                  done | jq -sc .)"
                  echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
            - name: Fail if no version was found
              if: steps.matrix.outputs.matrix == '[]'
              run: |
                  echo "::error::No supported stable DHIS2 version with a published Docker image was found"
                  exit 1
            - name: Log the versions that will be tested
              if: steps.matrix.outputs.matrix != '[]'
              env:
                  MATRIX: ${{ steps.matrix.outputs.matrix }}
              run: jq -r '.[] | "Testing \(.image) (major version \(.major))"' <<< "${MATRIX}"

    weekly-e2e:
        needs: [supported-versions]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.supported-versions.outputs.matrix) }}
        env:
            DHIS2_IMAGE: ${{ matrix.image }}
            DHIS2_CORE_MAJOR_VERSION: ${{ matrix.major }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7
            - name: Setup Docker BuildX
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
            - name: Build local Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  tags: dhis2/push-analytics:local
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Spin up the E2E environment
              # Fake SMTP is not needed for the e2e tests
              run: docker compose --env-file .env.e2e up -d web db db-dump post-install-scripts push-analytics
            - name: Run the e2e test suite
              run: docker compose --env-file .env.e2e up --abort-on-container-exit --exit-code-from e2e e2e
            - name: Copy scrape markdown logs and generated HTML to runner
              if: ${{ failure() }}
              run: |
                  mkdir e2e-output
                  mkdir e2e-output/scrape-markdown-logs
                  mkdir e2e-output/generated-html
                  pa_container_id="$(docker compose --env-file .env.e2e ps -q push-analytics)"
                  docker cp ${pa_container_id}:/usr/src/app/scrape-markdown-logs ./e2e-output
                  if [[ -d ./e2e/generated-html ]]; then cp -r ./e2e/generated-html ./e2e-output; fi
            - name: Store scrape markdown logs and generated HTML as a GHA artefact
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-output-${{ matrix.major }}
                  path: e2e-output/

    send-slack-message:
        runs-on: ubuntu-latest
        if: |
            failure() &&
            !cancelled()
        needs: [supported-versions, weekly-e2e]
        steps:
            - uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_BACKEND_WEBHOOK }}
                  SLACK_CHANNEL: 'analytics-internal-bot'
                  SLACK_MESSAGE: 'Push Analytics Weekly E2E run against stable DHIS2 failed and needs investigation ::female-detective:.'
                  SLACK_COLOR: '#ff0000'
